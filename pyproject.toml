[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisan"
version = "0.1.0"
description = "Arabic text normalization for search, matching, and model input: diacritics, alef and yeh variants, Eastern digits, language ratio. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["lisan*"]
